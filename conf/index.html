<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Tarefas</title><style>body{font-family:system-ui;max-width:42rem;margin:3rem auto;padding:0 1rem}form{display:flex;gap:.5rem}input{flex:1;padding:.6rem}button{padding:.6rem}li{margin:.6rem 0}</style><h1>Minhas tarefas</h1><form id="f"><input id="t" placeholder="Nova tarefa" required><button>Adicionar</button></form><ul id="lista"></ul><script>const l=document.querySelector('#lista'),f=document.querySelector('#f'),t=document.querySelector('#t');async function carregar(){let r=await fetch('/api/tarefas');l.innerHTML=(await r.json()).map(x=>`<li><label><input type=checkbox ${x.feita?'checked':''} onchange="feito(${x.id},this.checked)"> ${x.titulo}</label> <button onclick="apagar(${x.id})">Excluir</button></li>`).join('')}async function feito(id,feita){await fetch('/api/tarefas/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({feita})});carregar()}async function apagar(id){await fetch('/api/tarefas/'+id,{method:'DELETE'});carregar()}f.onsubmit=async e=>{e.preventDefault();await fetch('/api/tarefas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({titulo:t.value})});t.value='';carregar()};carregar()</script></html>
